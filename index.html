<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Caption App - Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #08090b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

    /* Floating Social Logos Animation */
    .floating-logo { position: absolute; width: 45px; opacity: 0.25; animation: float 6s ease-in-out infinite; pointer-events: none; }
    .yt-logo { top: 12%; left: 8%; animation-delay: 0s; }
    .ig-logo { top: 25%; right: 10%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }

    /* Header Bar */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; z-index: 10; }
    .app-title { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Top Right Pro Badge */
    .pro-badge { background: linear-gradient(135deg, #ff8c00, #ff0080); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-decoration: none; box-shadow: 0 0 10px rgba(255, 0, 128, 0.4); cursor: pointer; }

    /* Main Action Area */
    .main-section { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 40px 20px 30px; text-align: center; z-index: 10; }
    .create-btn { background: #22c55e; color: #000; width: 100%; max-width: 320px; padding: 18px; border: none; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35); transition: transform 0.2s; }
    .create-btn:active { transform: scale(0.97); }
    .sub-text { color: rgba(255, 255, 255, 0.45); font-size: 13px; margin-top: 10px; font-weight: 500; }

    /* Projects Section */
    .projects-section { flex: 1; background: #111318; border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 24px 20px; z-index: 10; border-top: 1px solid #1f232d; }
    .section-title { font-size: 16px; font-weight: 700; color: #a0a5b5; margin-bottom: 16px; }

    /* Empty State Container */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; color: rgba(255, 255, 255, 0.4); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.6; }
    .empty-text { font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Floating Logos -->
  <svg class="floating-logo yt-logo" viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
  <svg class="floating-logo ig-logo" viewBox="0 0 24 24" fill="#E1306C"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

  <!-- Header Section -->
  <div class="header">
    <div class="app-title">Nova Caption</div>
    <div class="pro-badge" onclick="alert('PRO Subscription: ₹50/month for Unlimited Export & No Ads!')">👑 PRO ₹50/mo</div>
  </div>

  <!-- Main Action Button -->
  <div class="main-section">
    <button class="create-btn" onclick="alert('Opening Gallery to Select Video...')">+ Select Video</button>
    <div class="sub-text">Create your caption video</div>
  </div>

  <!-- Recent Projects / Drafts -->
  <div class="projects-section">
    <div class="section-title">Recent Videos</div>
    
    <!-- Empty State (Jab koi video pehle na bani ho) -->
    <div class="empty-state">
      <div class="empty-icon">🎬</div>
      <div class="empty-text">Create your first Caption video</div>
    </div>
  </div>

</body>
</html>
